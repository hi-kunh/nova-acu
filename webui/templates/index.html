<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ACU 데몬 설정</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input { width: 100%; padding: 6px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 20px; padding: 8px 16px; }
    .hint { color: #666; font-size: 0.85em; margin-top: 2px; }
    .flash { padding: 8px 12px; margin-top: 12px; border-radius: 4px; }
    .flash.success { background: #dff0d8; color: #3c763d; }
    .flash.warning { background: #fcf8e3; color: #8a6d3b; }
    .flash.error   { background: #f2dede; color: #a94442; }
  </style>
</head>
<body>
  <h1>ACU 데몬 설정</h1>
  <p class="hint">
    저장하면 config.json을 갱신하고, acud에 SIGHUP을 보내 재시작 없이 반영합니다.
    &middot; <a href="{{ url_for('network') }}">네트워크 설정</a>
    &middot; <a href="{{ url_for('logout') }}">로그아웃</a>
  </p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="post">
    <label for="db_path">DB 경로 (db_path)</label>
    <input type="text" id="db_path" name="db_path" value="{{ cfg.db_path }}" required>

    <label for="door_open_seconds">도어 릴레이 동작 시간 (door_open_seconds, 1~99초)</label>
    <input type="number" id="door_open_seconds" name="door_open_seconds"
           min="1" max="99" value="{{ cfg.door_open_seconds }}" required>
    <div class="hint">IDTi Device Output(Relay) ActiveTime과 동일한 범위</div>

    <label for="new_password">단말기 비밀번호 변경 (선택, 숫자 4자리)</label>
    <input type="password" id="new_password" name="new_password" inputmode="numeric"
           pattern="\d{4}" maxlength="4" placeholder="비워두면 변경 안 함">

    <label for="new_password_confirm">새 비밀번호 확인</label>
    <input type="password" id="new_password_confirm" name="new_password_confirm" inputmode="numeric"
           pattern="\d{4}" maxlength="4" placeholder="비워두면 변경 안 함">

    <button type="submit">저장 및 acud에 반영</button>
  </form>
</body>
</html>
